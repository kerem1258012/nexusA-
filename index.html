<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<!-- LEFT SERVER BAR -->
<div class="servers">
  <div class="logo">N</div>
  <div class="srv active">GEN</div>
  <div class="srv">DEV</div>
  <div class="srv">AI</div>
</div>

<!-- CHANNEL PANEL -->
<div class="channels">

  <div class="userBox">
    <div id="user">user</div>
    <div class="status">online</div>
  </div>

  <div class="title">CHANNELS</div>

  <div id="channelList"></div>

  <button onclick="createChannel()">+ Channel</button>

  <div class="title">COMMANDS</div>
  <div class="cmdHint">
    @nexus = AI<br>
    #file = file create<br>
    @user = mention
  </div>

</div>

<!-- CHAT -->
<div class="chat">

  <div class="header" id="header"># general</div>

  <div id="messages"></div>

  <div id="typing"></div>

  <div class="input">
    <input id="input" placeholder="@nexus / #file / message">
    <button onclick="send()">Send</button>
  </div>

</div>

<!-- VS CODE -->
<div class="editor">

  <div class="fileHeader">FILES</div>

  <div id="files"></div>

  <textarea id="editor" placeholder="// code editor"></textarea>

  <div class="editorBar">
    <button onclick="newFile()">New</button>
    <button onclick="saveFile()">Save</button>
    <button onclick="runFile()">Run</button>
  </div>

  <div id="terminal"></div>

</div>

</div>

<script src="app.js"></script>
<script src="ai.js"></script>

</body>
</html>

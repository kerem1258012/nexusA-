<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<!-- LEFT -->
<div class="sidebar">

  <div class="profile">
    <div class="avatar"></div>
    <div>
      <div id="user">user</div>
      <small>online</small>
    </div>
  </div>

  <div class="section">KANALLAR</div>
  <div id="channels"></div>

  <button onclick="createChannel()">+ Kanal</button>

</div>

<!-- CHAT -->
<div class="chat">

  <div class="header" id="title"># genel</div>

  <div id="messages"></div>

  <div class="input">
    <input id="input" placeholder="@nexus yaz... #file oluştur">
    <button onclick="send()">➤</button>
  </div>

</div>

<!-- EDITOR -->
<div class="editor">

  <div class="files" id="files"></div>

  <textarea id="code"></textarea>

  <div class="bar">
    <button onclick="newFile()">New</button>
    <button onclick="saveFile()">Save</button>
    <button onclick="run()">Run</button>
  </div>

  <div id="terminal"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
